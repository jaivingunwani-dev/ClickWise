<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click-Wise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
        }

        .container {
            padding: 16px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 4px;
            color: #111;
        }

        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
        }

        .message {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 8px 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            background: #f0f4ff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #1e40af;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Click-Wise</h1>
        <p class="subtitle">Legal Document Analyzer</p>
        <p class="message">
            Click-Wise analyzes Terms of Service, Privacy Policies, and other legal documents
            to help you understand what you're agreeing to.
        </p>
        <button onclick="openSidePanel()">Open Analyzer</button>
        <div class="info">
            💡 Open this page's legal documents in the sidepanel to get started.
        </div>
    </div>

    <script>
        function openSidePanel() {
            chrome.sidePanel.open({ tabId: chrome.devtools.inspectedWindowTabId });
        }

        // Fallback for non-devtools context
        if (!chrome.devtools) {
            document.querySelector('button').onclick = () => {
                chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
                    if (tabs[0]?.id) {
                        chrome.sidePanel.open({ tabId: tabs[0].id });
                    }
                });
            };
        }
    </script>
</body>
</html>
